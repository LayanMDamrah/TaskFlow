<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Projects</title>

    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/dashboard.css" />
  </head>
  <body>
    <!-- sidebar section -->
    <nav class="sidebar">
      <div class="logo">
        <div class="logo-mark"></div>
        <span class="logo-text">TaskFlow</span>
      </div>

      <ul class="nav-list">
        <li class="nav-item">
          <a href="./dashoard.html">
            <span class="dot"></span>
            Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a href="./myTickets.html">
            <span class="dot"></span>
            My Tickets
          </a>
        </li>

        <li class="nav-item active">
          <a href="./projectPage.html">
            <span class="dot"></span>
            Projects
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main -->
    <section class="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>

        <div class="topbar-title">Personal workspace</div>

        <div class="topbar-user">
          <div class="avatar">T</div>
          <span>Tareem</span>
        </div>
      </div>

      <section class="dashboard">
        <div class="title">
          <h1>Dashboard</h1>
          <p class="topbar-title">
            A quick view of your projects and assigned tickets.
          </p>
        </div>

        <section class="cards-row">
          <div class="card">
            <div class="card-header">
              <span class="topbar-title">My Projects</span>
              <span class="dot"></span>
            </div>

            <h1 class="card-count">0</h1>
          </div>

          <div class="card">
            <div class="card-header">
              <span class="topbar-title">Assigned Tickets</span>
              <span class="dot"></span>
            </div>

            <h1 class="card-count">0</h1>
          </div>

          <div class="card">
            <div class="card-header">
              <span class="topbar-title">In Progress</span>
              <span class="dot"></span>
            </div>

            <h1 class="card-count">0</h1>
          </div>
          <div class="card">
            <div class="card-header">
              <span class="topbar-title">Need Review</span>
              <span class="dot"></span>
            </div>

            <h1 class="card-count">0</h1>
          </div>
        </section>
      </section>

      
    </section>

    <script src="./assets/js/sidebar.js"></script>
  </body>
</html>
