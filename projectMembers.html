<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Project Members</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body>
    <!-- sidebar section -->
    <nav class="sidebar">
      <div class="logo">
        <div class="logo-mark"></div>
        <span class="logo-text">TaskFlow</span>
      </div>

      <ul class="nav-list">
        <li class="nav-item">
          <a href="./dashoard.html">
            <span class="dot"></span>
            Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a href="./myTickets.html">
            <span class="dot"></span>
            My Tickets
          </a>
        </li>

        <li class="nav-item active">
          <a href="./projectPage.html">
            <span class="dot"></span>
            Projects
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main -->
    <section class="main">
      <!-- topbar section -->
      <div class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="topbar-title">Personal workspace</div>
        <div class="topbar-user">
          <div class="avatar">T</div>
          <span>Tareem</span>
        </div>
      </div>

      <div class="content">
        <!-- page title + add member button -->
        <div class="tickets-header">
          <h1 class="project-title">Website Redesign</h1>
          <button class="btn-primary">Add Member</button>
        </div>

        <!-- tabs section -->
        <div class="tabs">
          <a href="./projectDetails.html" class="tab">Overview</a>
          <a href="./projectTickets.html" class="tab">Tickets</a>
          <a href="./projectMembers.html" class="tab active">Members</a>
        </div>
        <!-- members panel header -->
        <div class="panel members-header-panel">
          <h3>Project Members</h3>
          <p class="panel-sub">6 members</p>
        </div>

        <!-- members table panel -->
        <div class="tickets-table-wrap">
          <table class="tickets-table">
            <thead>
              <tr>
                <th>Member</th>
                <th>Project role</th>
                <th>Email</th>
                <th>Tickets</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- rows will be added next -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <script src="./assets/js/sidebar.js"></script>
  </body>
</html>
