<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Projects</title>

    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/dashboard.css" />
    <link rel="stylesheet" href="./assets/css/profile.css" />
  </head>
  <body>
    <!-- sidebar section -->
    <nav class="sidebar">
      <div class="logo">
        <div class="logo-mark"></div>
        <span class="logo-text">TaskFlow</span>
      </div>

      <ul class="nav-list">
        <li class="nav-item">
          <a href="./dashoard.html">
            <span class="dot"></span>
            Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a href="./myTickets.html">
            <span class="dot"></span>
            My Tickets
          </a>
        </li>

        <li class="nav-item active">
          <a href="./projectPage.html">
            <span class="dot"></span>
            Projects
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main -->
    <section class="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>

        <div class="topbar-title">Personal workspace</div>

        <div class="topbar-user" id="profileBtn">
          <div class="avatar">T</div>
          <span>Tareem</span>
          <span class="profile-arrow">⌄</span>

          <div class="profile-dropdown" id="profileDropdown">
            <a href="./profile.html">Profile</a>
            <a href="./account.html">Account Settings</a>
            <a href="#" class="logout">Log out</a>
          </div>
        </div>
      </div>

      <div class="main-container">
        <section class="dashboard">
          <div class="title">
            <h1>Profile</h1>
            <p class="topbar-title">Update your personal information.</p>
          </div>

          <div class="profile">
            <div class="title">
              <h1>Personal Information</h1>
              <p class="topbar-title">
                Edit the details connected to your TaskFlow account.
              </p>
            </div>

            <div class="profile-row">
              <div class="pra-ava">
                <span class="avatar-d">TA</span>

                <div class="profile-info">
                  <span class="profile-name">Profile photo</span>
                  <span class="profile-description"
                    >Optional profile image for your account.</span
                  >
                </div>

                <button class="btn">Change photo</button>
              </div>
            </div>

            <form class="profile-form">
              <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                  type="text"
                  id="fullName"
                  placeholder="Enter your name"
                />
              </div>

              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" />
              </div>

              <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="Enter your phone" />
              </div>

              <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender">
                  <option value="">Select gender</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </form>
            <div class="form-actions">
              <button type="button" class="cancel-btn">Cancel</button>
              <button type="submit" class="save-btn">Save Changes</button>
            </div>
          </div>
        </section>
      </div>
    </section>

    <script src="./assets/js/sidebar.js"></script>
  </body>
</html>
