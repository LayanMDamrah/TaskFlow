<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Password Reset</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="success-resetP.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo" aria-label="TaskFlow home">
            <div class="logo-icon" aria-hidden="true"></div>
            <span class="logo-text">TaskFlow</span>
        </a>
    </nav>

    <main class="success-panel">

        <section class="success-card">

            <div class="success-icon">✓</div>

            <h1>Password reset successfully</h1>

            <p class="success-description">
                Your password has been updated.
                You can now log in with your new password.
            </p>

            <a href="login.html" class="back-login-button">
                Back to login
            </a>

            <p class="success-note">
                You’ll need to use your new password next time you sign in.
            </p>

        </section>

    </main>

</body>
</html>
