<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TaskFlow</title>
        <link rel="stylesheet" href="global.css">
        <link rel="stylesheet" href="success-resetP.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                <div class="logo-icon"></div>
                <span class="logo-text">TaskFlow</span>
            </div>

        </nav>
        <div class="successPanel">
            <div class="step done" id="success">
                        <div class="step-number" id="circle">✓</div>
                        <div class="step-content">
                        <div class="step-text"><h3>Password reset successfully</h3></div>
                        <p>Your password has been updated. You can now log in with your new password.</p>
                        </div>
                        <button type="submit">Back to login</button>
                        <p>You’ll need to use your new password next time you sign in.</p>
                    </div>
        </div>
    </body>
</html>
